# INDEX ONLY -- no diffs live in this directory. Each `branch` below is a branch
# on https://github.com/davetha/vllm. All but one have their CONTENT in the tag
# VERSIONS pins (VLLM_REF), which is what build/Dockerfile clones.
#
# THE EXCEPTION: nvfp4-w4a16-gfx90a is POST-TAG. Its branch is 4 commits ahead of
# v0.27.2rc0+mi210.5 and the kernel file it adds
# (vllm/model_executor/kernels/linear/nvfp4/triton_gfx90a.py) does not exist at
# that tag, so it is in NO image built from the current pin. It is indexed here
# anyway, marked `status: post-tag`, so it is not lost between pins -- but do not
# read this file as "everything below ships".
#
# CONTENT-IN-TAG AND COMMIT-IN-TAG ARE DIFFERENT QUESTIONS, and this file answers
# the first. Two branches -- rocm-w4a16-tiles-gfx90a and
# rocm-w4a16-bittrick-gfx90a -- have tips that are NOT ancestors of the tag,
# because assembling the mi210.5 wave re-applied them under new SHAs. Their
# content did ship (grep the tag itself, below); the branch tips are just stale.
# So `merge-base --is-ancestor` is the wrong test here and will mislead you:
#
#   # what actually shipped -- ask the tag, not the branch
#   git -C <fork> show $VLLM_REF:vllm/model_executor/kernels/linear/mixed_precision/triton_w4a16.py \
#     | grep -c 'elif on_gfx90a():'
#
# .github/workflows/sources-only.yml's registry-matches-fork job asks the
# commit-identity question (ahead_by == 0) and therefore flags all three. One of
# those three is real (NVFP4); two are stale branch tips to re-point or delete.
#
# See patches/README.md.
#
# The -v0.27.2rc0 suffix is the rebase onto that upstream tag. The unsuffixed
# branches are NOT deleted: they are the v0.26.1rc0 lineage, still reachable
# from tag v0.26.1rc0+mi210.1, so an older image can still be reproduced.
#
# Rebasing was not mechanical. `git apply --3way` reported all five clean, but a
# real `git rebase` -- which drops already-upstream commits by patch-id --
# conflicted on three. Trust the rebase, not the apply.
#
# Every patch carries two predicates:
#   obsolete_when  -- true on a new base => DROP the branch, close the PR
#   verify         -- the test that says it still works
#
# Without the first, upgrades become archaeology. Determining these five by hand
# on 2026-08-04 took hours; they are written down so it never costs that again.
# Dropping a patch is the GOOD outcome: it means the work landed upstream.
#
# Eleven branches, thirteen changes: rocm-paged-attention-256k carries the multi-pass
# reduction plus three local gfx90a commits, which README lists separately
# because they are separately justified. (It was five branches / seven changes
# through mi210.1; the five W4A16/FP8/NVFP4 entries below are the mi210.5 wave.)
#
# ../upgrade.sh <tag> runs every obsolete_when against a fresh upstream worktree.

- name: rocm-paged-attention
  branch: rocm-paged-attention-256k-v0.28.0rc2
  upstream: [39001]
  carries: "Eugene Kuznetsov's multi-pass reduction + 3 local gfx90a commits"
  obsolete_when: "grep -q 'npar_loops > 16' csrc/rocm/attention.cu"
  still_needed_when: "grep -q 'max_seq_len <= 128 \\* 1024' vllm/platforms/rocm.py"
  verify: "pytest tests/kernels/attention/test_rocm_paged_attention_long_context.py"   # 11

- name: wvsplitk-oob
  branch: rocm-wvsplitk-oob-strided-v0.28.0rc2
  upstream: [50618]
  carries: "John Qin / Yanyuan Qin; reproduced on gfx90a before merging.
    Rebasing onto v0.27.2rc0 collapsed 4 commits into 1: upstream took the
    original OOB fix (weight guard in skinny_operands_compatible, plus
    .contiguous() on the reshaped activation), so those commits dropped as
    already-upstream. What survives is the singleton refinement -- PyTorch's
    contiguity test ignores singleton dimensions, so .contiguous() is a no-op
    on a one-row strided slice and upstream's fix does not cover it."
  obsolete_when: "grep -q 'contiguous_format' vllm/model_executor/layers/utils.py"
  verify: "pytest tests/model_executor/layers/test_rocm_unquantized_gemm.py"           # 4

