# INDEX ONLY -- no diffs live in this directory. Each `branch` below is a branch
# on https://github.com/davetha/vllm, already merged into the tag VERSIONS pins
# (VLLM_REF), which is what build/Dockerfile clones. See patches/README.md.
#
# The -v0.27.2rc0 suffix is the rebase onto that upstream tag. The unsuffixed
# branches are NOT deleted: they are the v0.26.1rc0 lineage, still reachable
# from tag v0.26.1rc0+mi210.1, so an older image can still be reproduced.
#
# Rebasing was not mechanical. `git apply --3way` reported all five clean, but a
# real `git rebase` -- which drops already-upstream commits by patch-id --
# conflicted on three. Trust the rebase, not the apply.
#
# Every patch carries two predicates:
#   obsolete_when  -- true on a new base => DROP the branch, close the PR
#   verify         -- the test that says it still works
#
# Without the first, upgrades become archaeology. Determining these five by hand
# on 2026-08-04 took hours; they are written down so it never costs that again.
# Dropping a patch is the GOOD outcome: it means the work landed upstream.
#
# Five branches, seven changes: rocm-paged-attention-256k carries the multi-pass
# reduction plus three local gfx90a commits, which README lists separately
# because they are separately justified.
#
# ../upgrade.sh <tag> runs every obsolete_when against a fresh upstream worktree.

- name: rocm-paged-attention
  branch: rocm-paged-attention-256k-v0.27.2rc0
  upstream: [39001]
  carries: "Eugene Kuznetsov's multi-pass reduction + 3 local gfx90a commits"
  obsolete_when: "grep -q 'npar_loops > 16' csrc/rocm/attention.cu"
  still_needed_when: "grep -q 'max_seq_len <= 128 \\* 1024' vllm/platforms/rocm.py"
  verify: "pytest tests/kernels/attention/test_rocm_paged_attention_long_context.py"   # 11

- name: wvsplitk-oob
  branch: rocm-wvsplitk-oob-strided-v0.27.2rc0
  upstream: [50618]
  carries: "John Qin / Yanyuan Qin; reproduced on gfx90a before merging.
    Rebasing onto v0.27.2rc0 collapsed 4 commits into 1: upstream took the
    original OOB fix (weight guard in skinny_operands_compatible, plus
    .contiguous() on the reshaped activation), so those commits dropped as
    already-upstream. What survives is the singleton refinement -- PyTorch's
    contiguity test ignores singleton dimensions, so .contiguous() is a no-op
    on a one-row strided slice and upstream's fix does not cover it."
  obsolete_when: "grep -q 'contiguous_format' vllm/model_executor/layers/utils.py"
  verify: "pytest tests/model_executor/layers/test_rocm_unquantized_gemm.py"           # 4

- name: int4-interleave-gfx9
  branch: rocm-int4-interleave-gfx9-v0.27.2rc0
  upstream: [43389]
  carries: "amd-xavierwang's int4 repack, gate widened from on_gfx1x to include GFX9"
  # If upstream widens it themselves, ours is redundant.
  obsolete_when: "grep -q 'on_gfx9' vllm/model_executor/layers/quantization/compressed_tensors/compressed_tensors_moe/compressed_tensors_moe_wna16.py"
  verify: "pytest tests/kernels/moe/test_moe.py -k 'wn16 and 4'"                        # 8

- name: sharded-state-tp
  branch: fix/sharded-state-tp-mismatch-v0.27.2rc0
  upstream: []
  carries: "local; reject checkpoints saved at a different TP size"
  obsolete_when: "grep -q '_saved_tp_size' vllm/model_executor/model_loader/sharded_state_loader.py"
  verify: "pytest tests/model_executor/model_loader/test_sharded_state_loader.py -k 'saved_tp_size or load_weights or filter_subtensors'"  # 7

- name: benchmark-moe-int8
  branch: fix-benchmark-moe-int8-w8a16-v0.27.2rc0
  upstream: [31011]   # stale, auto-closed 2026-04-30
  carries: "local, grouping taken from #31011"
  obsolete_when: "! grep -q 'quant_dtype = torch.int8' benchmarks/kernels/benchmark_moe.py"
  verify: "pytest tests/benchmarks/test_benchmark_moe_quant_config.py"                  # 8

- name: w4a16-tiles-gfx90a
  branch: rocm-w4a16-tiles-gfx90a-v0.27.2rc0
  upstream: []
  carries: "local; gfx90a tile table for the dense W4A16 Triton GEMM"
  # Upstream added a gfx90a branch of its own to this selection. Until then,
  # gfx90a silently inherits the MI300 tiles, which assume 304 CUs against
  # MI210's 104 -- the failure is slowness, not breakage, so grep for the
  # branch existing rather than for any behavioural marker.
  obsolete_when: "grep -q 'on_gfx90a' vllm/model_executor/kernels/linear/mixed_precision/triton_w4a16.py"
  verify: "pytest tests/kernels/quantization/test_triton_w4a16.py"                      # if present upstream

- name: w4a16-bittrick-gfx90a
  branch: rocm-w4a16-bittrick-gfx90a-v0.27.2rc0
  upstream: []
  carries: "local; magic-bias dequant + scale hoist for the dense W4A16 GEMM"
  # Obsolete when upstream stops doing per-weight bf16 arithmetic in this loop.
  # The marker is the hoist itself, since the bit trick alone is worth little.
  obsolete_when: "grep -q USE_MAGIC_BIAS vllm/model_executor/kernels/linear/mixed_precision/triton_w4a16.py"
  verify: "pytest tests/kernels/quantization/test_triton_w4a16.py"

# DRAFT additions to patches/registry.yaml -- NOT applied to the real file.
# Three new entries below, in the same schema as the existing seven. Append
# to the end of the real registry.yaml at ship time (after the existing
# w4a16-bittrick-gfx90a entry).
#
# Branch topology, final: the FP8 branch (rocm-wfp8a16-gfx90a-v0.27.2rc0) is
# 6 commits ending a28f57dea8 (3f657e07fb..a28f57dea8; a28f57dea8 amends an
# earlier tip, 96be2e3c58, after a sampling-methodology correction to the
# tile ladder -- see docs/FP8-GFX90A.md's Tile ladder section). The W4A16
# M<=16 narrow-rung commit that used to sit on this same branch in violation of
# the one-branch-per-patch rule is resolved: it is 3e17cd4213, cherry-picked
# off this branch onto its own dedicated branch, rocm-w4a16-gfx90a-v0.27.2rc0
# -- see the new w4a16-narrow-m16-gfx90a entry below. No longer a flagged
# decision; done.

- name: w8a16-fp8-gfx90a
  branch: rocm-wfp8a16-gfx90a-v0.27.2rc0
  upstream: []
  carries: "local; fused Triton W8A16 fp8 GEMM for gfx90a (dequant e4m3fn
    weights in the GEMM inner loop, bf16-native decode by default with a
    verified fp16 bit-trick fallback behind decode=\"fp16\"), registered in
    _POSSIBLE_WFP8A16_KERNELS[ROCM] ahead of the previously-empty list, plus
    the CDNA2 W8A8->W8A16 compressed-tensors dispatcher fallback fix
    (a CUDA-shaped get_device_capability() threshold was accidentally
    clearing on gfx90a's (9,0) numbering and routing FP8 checkpoints into a
    torch._scaled_mm crash instead of the weight-only scheme) and the final
    (M,N)-keyed, three-tile ladder (a28f57dea8: narrow/bm32/wide, fitting
    the per-cell best exactly -- 0.00% mean/worst loss -- over an 11x10
    grid once sampled correctly; see the doc's sampling-artifact note).
    6 commits, 3f657e07fb..a28f57dea8. See docs/FP8-GFX90A.md for the full
    writeup,
    measurement basis, and open backlog items."
  # Simple house-style single grep, matching the other seven entries' shape
  # rather than something clever: _POSSIBLE_WFP8A16_KERNELS' ROCM entry is
  # still literally the "# To be added" placeholder comment upstream today
  # (confirmed directly, not assumed -- see the FP8 entry-points recon).
  # obsolete_when is checked against a FRESH UPSTREAM worktree (per
  # upgrade.sh), so this can't grep for our own class name -- it greps for
  # upstream's placeholder being gone, i.e. upstream shipped SOME ROCm
  # kernel there, ours or not.
  obsolete_when: "! grep -Pzoq '(?s)_POSSIBLE_WFP8A16_KERNELS.*?PlatformEnum\\.ROCM: \\[\\s*# To be added' vllm/model_executor/kernels/linear/__init__.py"
  # No in-tree pytest yet -- this kernel has no committed test file (unlike
  # every other entry in this registry, which is itself worth noting rather
  # than papering over). Verification today is the standalone float64
  # oracle harness at /home/dave/fp8-oracle/ on big (task #16): 18 fixtures,
  # both decode variants, NaN load-time guard, fp16-activation-forcing
  # check. Passed in full for the default (bf16-native) variant; the fp16
  # variant's known activation-subnormal-flush limitation was independently
  # reproduced there, not a surprise. TODO: promote that harness (or a
  # pytest wrapper around it) into the fork's own tests/ tree so this line
  # can point at a real pytest path like every other entry does.
  verify: "python3 /home/dave/fp8-oracle/verify_kernel_gpu.py   # TODO: no in-tree pytest yet"

- name: w4a16-narrow-m16-gfx90a
  branch: rocm-w4a16-gfx90a-v0.27.2rc0
  upstream: []
  carries: "local; extends the dense W4A16 Triton GEMM's gfx90a narrow rung
    from M<=8 to M<=16 (commit 3e17cd4213), recovering 1.37-1.45x GB/s on
    M=9..16 by keeping the (16,32,64)/magic-bias narrow tile active over
    that range instead of falling to BLOCK_M=64 run over a fraction of real
    rows; widening the rung also widens where _use_magic_bias applies
    (keyed on BLOCK_M<=16), measured separately from the tile change itself
    since the two effects have opposite sign on gate_up. Correctness
    against a float64 oracle: 1.1e-06/1.6e-06 (magic-bias paths). Split onto
    its own branch, cherry-picked off rocm-wfp8a16-gfx90a-v0.27.2rc0 where
    it was first committed, per this repo's one-branch-per-patch rule --
    resolves the coupling docs/FP8-GFX90A.md's Tile ladder section used to
    flag as unresolved."
  # Same style as w4a16-bittrick-gfx90a's own obsolete_when: a single grep
  # for the narrow-rung gate this commit widened. Confirmed against the
  # actual diff, not guessed -- the commit changes `if M <= 8:` to
  # `if M <= 16:` in triton_w4a16.py's tile-selection block.
  obsolete_when: "grep -q 'if M <= 16:' vllm/model_executor/kernels/linear/mixed_precision/triton_w4a16.py"
  verify: "pytest tests/kernels/quantization/test_triton_w4a16.py"

- name: nvfp4-w4a16-gfx90a
  branch: rocm-nvfp4-a16-gfx90a-v0.27.2rc0
  upstream: []
  carries: "local; Triton NVFP4 W4A16 GEMM for gfx90a (packed e2m1 weight
    decode via the same bias-shift bit trick as the FP8 kernel, per-16-group
    e4m3 block scale + scalar global scale, ported from the measured
    prototype at task #19), registered in _POSSIBLE_NVFP4_KERNELS[ROCM]
    ahead of EmulationNvFp4LinearKernel and in the separate a16_kernels
    tuple, plus the analogous dispatcher fix: init_nvfp4_linear_kernel's
    linear_backend==\"auto\" and use_a16 branch force-selected the CUDA-only
    Marlin kernel unconditionally and raised before the ROCm registry was
    ever consulted, same bug class as w8a16-fp8-gfx90a's CDNA2 fallback fix,
    gated on current_platform.is_cuda() here too."
  # Same style as the FP8 entry above: _POSSIBLE_NVFP4_KERNELS' ROCM entry
  # is exactly `[EmulationNvFp4LinearKernel]` upstream today (confirmed
  # directly). Obsolete once that list holds anything else beyond Emulation
  # -- i.e. the immediate next line inside the ROCM block is no longer the
  # closing bracket.
  obsolete_when: "! grep -Pzoq '(?s)_POSSIBLE_NVFP4_KERNELS.*?PlatformEnum\\.ROCM: \\[\\s*EmulationNvFp4LinearKernel,\\s*\\],' vllm/model_executor/kernels/linear/__init__.py"
  # Partially verified as of 781a8e5665, still short of a real GEMM launch.
  # tests/kernels/quantization/test_nvfp4_w4a16_gfx90a.py pins two
  # class-path-level things by test (both confirmed PASSING against real
  # gfx90a hardware visibility, no GPU compute launch needed for either):
  # the global_scale convention (kernel receives it multiplicative, per the
  # CT scheme's own on-disk-divisor inversion) and the strategy=group
  # detector widening (nm-testing/TinyLlama-1.1B-Chat-v1.0-FP4's verbatim
  # quantization_config must resolve to CompressedTensorsW4A4Fp4(use_a16=
  # True), not raise). Inner-kernel numerical correctness across the tile
  # ladder was separately verified by fp8-decode against the float64 oracle
  # after the subnormal-underflow fix (30/254 -> 0/254, see 4988ba971e) --
  # not re-verified by this test file. Still no in-tree test that launches
  # an actual GEMM/compute kernel on this card; that remains the next step.
  verify: "pytest tests/kernels/quantization/test_nvfp4_w4a16_gfx90a.py   # class-path only; no GPU-launch test yet"
