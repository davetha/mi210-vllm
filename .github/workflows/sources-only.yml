name: sources-only

# This repo builds everything from git sources; it stores no build artifacts and
# no binaries. That is easy to say and easy to break -- a stray `git add -A`
# once committed a 22 MB ImageMagick blob named `aiter`, which read exactly like
# a checked-in AITER binary. Enforce the property instead of documenting it.

on:
  push:
  pull_request:

jobs:
  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject binary or oversized files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            # git's own definition: a NUL byte in the first 8000 bytes.
            if ! grep -Iq . "$f" 2>/dev/null; then
              echo "::error file=$f::binary file committed; this repo is sources only"
              fail=1
              continue
            fi
            size=$(wc -c < "$f")
            if [ "$size" -gt 262144 ]; then
              echo "::error file=$f::$size bytes exceeds the 256 KiB source-file limit"
              fail=1
            fi
          done < <(git ls-files)
          exit $fail

      - name: Every external source is pinned to an immutable ref
        run: |
          set -euo pipefail
          set -a; . ./VERSIONS; set +a
          fail=0
          # A digest cannot be re-pushed; a tag can.
          case "$BASE_IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::BASE_IMAGE must be pinned by digest, got $BASE_IMAGE"; fail=1 ;;
          esac
          # Every ref we clone must resolve, and must be a tag rather than a
          # branch: a branch moves and the build stops being reproducible.
          check_tag() {
            if ! git ls-remote --tags --exit-code "$1" "refs/tags/$2" >/dev/null 2>&1; then
              echo "::error::$1 has no tag $2"
              return 1
            fi
            echo "ok  $1 @ $2"
          }
          check_tag "$VLLM_FORK"   "$VLLM_REF"        || fail=1
          check_tag "$AITER_REPO"  "$AITER_REF"       || fail=1
          check_tag "$AITER_CDNA2" "$AITER_CDNA2_REF" || fail=1
          exit $fail

  shell:
    # Eight shell scripts run builds, verification and serving. A quoting bug
    # in one of them is a broken build or a silently wrong flag, and both have
    # happened here already.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(git ls-files '*.sh')
          printf 'checking %s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: compile and lint the model tools
        run: |
          set -euo pipefail
          python -m compileall -q probe/
          pip install --quiet ruff
          ruff check --select=E9,F63,F7,F82,F401,F841 probe/

  registry-matches-fork:
    # patches/registry.yaml indexes branches that live in the vLLM fork, not
    # here. Nothing stops it drifting from what the pinned tag actually
    # contains, and a registry that lists a patch the image does not carry is
    # worse than no registry -- it reads like proof.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every registry branch exists and is contained in VLLM_REF
        run: |
          set -euo pipefail
          set -a; . ./VERSIONS; set +a
          repo=${VLLM_FORK#https://github.com/}
          fail=0
          # `branch:` lines only -- registry.yaml has no other key ending in a
          # bare ref, and grep is enough for a file this shape.
          branches=$(sed -n 's/^[[:space:]]*branch:[[:space:]]*\(.*\)$/\1/p' patches/registry.yaml)
          [ -n "$branches" ] || { echo "::error::no branches parsed from registry.yaml"; exit 1; }
          for b in $branches; do
            if ! git ls-remote --heads --exit-code "$VLLM_FORK" "refs/heads/$b" >/dev/null 2>&1; then
              echo "::error::registry lists $b, which does not exist on $VLLM_FORK"
              fail=1; continue
            fi
            # ahead_by == 0 means every commit on the branch is already in the
            # tag, i.e. the patch really is in the image the build produces.
            ahead=$(curl -sfL -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/$repo/compare/$VLLM_REF...$b" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ahead_by","?"))')
            if [ "$ahead" = "0" ]; then
              echo "ok  $b is contained in $VLLM_REF"
            else
              echo "::error::$b has $ahead commit(s) NOT in $VLLM_REF; the image does not carry it"
              fail=1
            fi
          done
          exit $fail
